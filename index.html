<style>
  :root {
    --bg: #F1F3EF;
    --bg-elevated: #FFFFFF;
    --ink: #1B2620;
    --ink-soft: #55635A;
    --ink-faint: #8A968D;
    --rule: #D8DCD3;
    --margin: #B14D3A;
    --accent: #1F3D2B;
    --accent-soft: #E4EDE6;
    --gold: #B4791E;
    --gold-soft: #F3E4C4;
    --correct: #2F6B3F;
    --correct-soft: #E1EEE3;
    --incorrect: #B14D3A;
    --incorrect-soft: #F5E3DE;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(27,38,32,0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131C16;
      --bg-elevated: #1B271F;
      --ink: #EDF1EC;
      --ink-soft: #A6B4AB;
      --ink-faint: #71806F;
      --rule: #2B3931;
      --margin: #D9714F;
      --accent: #8FC7A0;
      --accent-soft: #223027;
      --gold: #DDA84F;
      --gold-soft: #382C15;
      --correct: #82C494;
      --correct-soft: #1E3324;
      --incorrect: #E08A6C;
      --incorrect-soft: #3A2620;
      --shadow: 0 1px 2px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #131C16;
    --bg-elevated: #1B271F;
    --ink: #EDF1EC;
    --ink-soft: #A6B4AB;
    --ink-faint: #71806F;
    --rule: #2B3931;
    --margin: #D9714F;
    --accent: #8FC7A0;
    --accent-soft: #223027;
    --gold: #DDA84F;
    --gold-soft: #382C15;
    --correct: #82C494;
    --correct-soft: #1E3324;
    --incorrect: #E08A6C;
    --incorrect-soft: #3A2620;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }
  body {
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    -webkit-font-smoothing: antialiased;
  }
  button {
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    background: none;
    border: none;
    cursor: pointer;
    color: inherit;
  }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .screen { padding: 28px 20px 40px; animation: fade-in 0.28s ease; }
  @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  .masthead h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .masthead .tag {
    font-size: 12.5px;
    color: var(--ink-faint);
  }

  .back-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 14.5px;
    color: var(--ink-soft);
    padding: 6px 4px;
  }
  .back-btn svg { width: 16px; height: 16px; }

  .intro {
    font-size: 15px;
    color: var(--ink-soft);
    margin: 0 0 24px;
    max-width: 38ch;
  }

  .install-tip {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--accent-soft);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--accent);
    line-height: 1.45;
  }
  .install-tip svg { flex-shrink: 0; margin-top: 1px; }
  .install-tip .tip-text { flex: 1; }
  .install-tip .tip-dismiss {
    flex-shrink: 0;
    font-size: 16px;
    line-height: 1;
    color: var(--accent);
    opacity: 0.6;
    padding: 2px;
  }

  /* subject list */
  .subject-list { display: flex; flex-direction: column; gap: 10px; }
  .subject-card {
    display: flex;
    align-items: center;
    gap: 14px;
    text-align: left;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    border-left: 3px solid var(--margin);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    width: 100%;
  }
  .subject-code {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .subject-meta { flex: 1; min-width: 0; }
  .subject-name {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 2px;
  }
  .subject-sub {
    font-size: 13px;
    color: var(--ink-faint);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .subject-best {
    font-size: 12.5px;
    color: var(--gold);
    font-weight: 500;
    white-space: nowrap;
  }

  /* subject detail */
  .paper-header {
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 18px;
  }
  .paper-header .code-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .paper-header h2 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .paper-header .meta-line {
    font-size: 13.5px;
    color: var(--ink-faint);
    margin: 0;
  }

  .stat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .stat-box {
    flex: 1;
    background: var(--bg-elevated);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .stat-box .num {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    display: block;
  }
  .stat-box .lbl {
    font-size: 11.5px;
    color: var(--ink-faint);
  }

  .start-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--accent);
    color: #fff;
    padding: 16px 18px;
    border-radius: var(--radius);
    margin-bottom: 10px;
    font-weight: 500;
    font-size: 15.5px;
  }
  .start-btn.secondary {
    background: var(--bg-elevated);
    color: var(--ink);
    border: 1px solid var(--rule);
  }
  .start-btn .desc {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.8;
    display: block;
    margin-top: 2px;
  }
  .start-btn .chev { flex-shrink: 0; opacity: 0.8; }

  .history-block { margin-top: 22px; }
  .history-block h3 {
    font-size: 13px;
    text-transform: none;
    color: var(--ink-faint);
    margin: 0 0 10px;
    font-weight: 500;
  }
  .history-row {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
    font-size: 13.5px;
  }
  .history-row:last-child { border-bottom: none; }
  .history-row .h-score { font-weight: 600; }
  .history-row .h-mode { color: var(--ink-faint); font-size: 12px; }
  .empty-note {
    font-size: 13.5px;
    color: var(--ink-faint);
    font-style: italic;
  }

  /* quiz runner */
  .quiz-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 10px;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 5;
  }
  .quiz-progress { font-size: 13px; color: var(--ink-soft); }
  .quiz-progress .subject-tag { color: var(--ink-faint); display: block; font-size: 11.5px; margin-bottom: 1px; }
  .timer-ring { position: relative; width: 46px; height: 46px; }
  .timer-ring svg { transform: rotate(-90deg); width: 46px; height: 46px; }
  .timer-ring circle { fill: none; stroke-width: 4; }
  .timer-ring .track { stroke: var(--rule); }
  .timer-ring .progress { stroke: var(--gold); stroke-linecap: round; transition: stroke-dashoffset 0.25s linear, stroke 0.2s ease; }
  .timer-ring .progress.urgent { stroke: var(--incorrect); }
  .timer-ring .num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  .quiz-body { padding: 6px 20px 120px; }
  .quiz-bar {
    height: 3px;
    background: var(--rule);
    border-radius: 2px;
    margin: 0 20px 22px;
    overflow: hidden;
  }
  .quiz-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .question-prompt {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 500;
    line-height: 1.4;
    margin: 0 0 24px;
  }

  .option-list { display: flex; flex-direction: column; gap: 10px; }
  .option-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    text-align: left;
    width: 100%;
    background: var(--bg-elevated);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 13px 14px;
    font-size: 15px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option-row .mark {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .option-row .opt-text { padding-top: 2px; }
  .option-row.correct {
    border-color: var(--correct);
    background: var(--correct-soft);
  }
  .option-row.correct .mark { background: var(--correct); color: #fff; }
  .option-row.incorrect {
    border-color: var(--incorrect);
    background: var(--incorrect-soft);
  }
  .option-row.incorrect .mark { background: var(--incorrect); color: #fff; }
  .option-row.dim { opacity: 0.55; }
  .option-row[disabled] { cursor: default; }

  .timeout-note {
    font-size: 13.5px;
    color: var(--incorrect);
    margin: -10px 0 20px;
  }

  .quiz-footer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .next-btn {
    width: 100%;
    max-width: 440px;
    background: var(--accent);
    color: #fff;
    padding: 15px;
    border-radius: var(--radius);
    font-weight: 500;
    font-size: 15.5px;
    box-shadow: 0 4px 14px rgba(31,61,43,0.25);
  }

  /* review */
  .score-card {
    background: var(--bg-elevated);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 22px;
    text-align: center;
    margin-bottom: 20px;
  }
  .score-card .score-num {
    font-family: var(--font-display);
    font-size: 42px;
    font-weight: 600;
    margin: 0;
    line-height: 1;
  }
  .score-card .score-pct {
    color: var(--ink-faint);
    font-size: 14px;
    margin: 6px 0 0;
  }
  .score-card .best-note {
    margin-top: 12px;

    color: var(--gold);
    font-weight: 500;
  }

    padding: 15px 16px;
    margin-bottom: 12px;
  }
  .missed-item .m-topic {
    font-size: 11.5px;
    color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .missed-item .m-prompt {
    font-size: 14.5px;
    margin: 0 0 10px;
    line-height: 1.45;
  }
  .missed-item .m-answer {
    font-size: 13px;
    display: flex;
    gap: 6px;
    margin-bottom: 3px;
  }
  .missed-item .m-answer .lbl { color: var(--ink-faint); min-width: 68px; flex-shrink: 0; }
  .missed-item .m-answer.wrong .val { color: var(--incorrect); }
  .missed-item .m-answer.right .val { color: var(--correct); }

  .action-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 24px;
  }

"],"c":3,"t":"social-studies","tl":45},{"p":"A company is expanding globally and needs to socialize employees to new cultural norms. Which of the following approaches would be most effective?","o":["Encourage employees to adapt to the new culture on their own","Provide employees with a cultural sensitivity training program","Encourage employees to maintain their existing cultural practices","Provide employees with a detailed guide to world cultures"],"c":1,"t":"social-studies","tl":45},{"p":"Which one of the following took place after the 27th April, 1960 referendum?","o":["Ghana became a democratic state","The first political party was formed","Kwame Nkrumah was inaugurated as Prime Minister","Queen Elizabeth II was inaugurated as Prime Minister"],"c":0,"t":"social-studies","tl":45},{"p":"Which of the following scenarios explain the main purpose of the internet?","o":["Connecting electronic devices and making lives more convenient","Robots building several vehicles at a time","Developing new medicine kits","Scientists going to space and other planets"],"c":0,"t":"social-studies","tl":45},{"p":"Two communities are claiming ownership of a river which serves as their livelihood. This has resulted in conflicts between the two communities for many years. Which of the following mediations will best help to resolve the conflict?","o":["Avoid future conflicts","Facilitate communication and mutually acceptable solutions","Determine who is right or wrong","Impose a solution on the parties"],"c":1,"t":"social-studies","tl":45},{"p":"The following factors affect Ghana's ability to exploit its natural resources effectively except","o":["low level technology","inadequate capital resource","limited technical expertise","farming activities"],"c":3,"t":"social-studies","tl":45},{"p":"A company is planning to build a soap factory in a rural area. The factory will provide jobs for the youth but may also pollute nearby rivers. Which of the following options best represents a sustainable development approach?","o":["Build the factory without environmental considerations","Build the factory with environmental impact assessment","Build the factory with some environmental considerations","Reject the factory proposal to protect the environment"],"c":1,"t":"social-studies","tl":45},{"p":"Respecting the rights of others and performing our responsibilities to the state help to promote","o":["building political parties","responsible citizenship","community development","national integration"],"c":1,"t":"social-studies","tl":45},{"p":"In 1957 the people of Ghana gained independence from the British colonial rule after a long political struggle. What was the main reason for Ghana's independence? To","o":["adopt a new political system and form a government","make Ghanaian culture and traditions superior to the British","gain economic freedom and control our natural resources","unite with other African countries and form a single nation"],"c":2,"t":"social-studies","tl":45},{"p":"People join social security and pension schemes in order to","o":["ensure retirement income","raise money to satisfy political ambitions","maintain standard of living in the cities","supplement income for relations in the villages"],"c":0,"t":"social-studies","tl":45},{"p":"The most significant attitude that helps to enhance self-identity of the individual in the community is","o":["always wearing clean clothes","engaging in peer teaching in school","avoiding peer influence in the community","showing respect to the elderly"],"c":3,"t":"social-studies","tl":45},{"p":"A farmer is preparing to plant crops next week. Why is it important for the farmer to check the weather forecast? To","o":["prepare for a storm","plan a harvest festival","determine the ideal time for planting","predict the best time for irrigation"],"c":2,"t":"social-studies","tl":45},{"p":"The destruction of farm lands by cattle and the confrontation between herdsmen and farming communities in Ghana can best be resolved by","o":["allowing the game and wildlife department to take charge of cattle rearing in the communities","local farmers always standing by to drive away herdsmen","encouraging the practice of cattle ranching in our communities","seizing and distributing some of the cattle to the affected communities"],"c":2,"t":"social-studies","tl":45},{"p":"What is the main function of socialization? To","o":["enforce laws and regulations","teach individuals how to survive","provide education","transmit culture and values"],"c":3,"t":"social-studies","tl":45},{"p":"Which of the following entrepreneurial skills is most important for someone starting a business to acquire in order to help overcome unexpected challenges?","o":["Leadership","Risk taking","Adaptability","Savings"],"c":2,"t":"social-studies","tl":45},{"p":"The first general election held in the Gold Coast in 1951 was won by the","o":["Convention People's Party","National Alliance for the Liberals","National Liberation Movement","United Gold Coast Convention"],"c":0,"t":"social-studies","tl":45},{"p":"It has been observed that the population of Ghana has been rising rapidly over the years. What is the primary reason for the rapidly growing population?","o":["High birth rate and low death rate","Improved health care and sanitation","Increased education and family planning","Increased immigration and low emigration"],"c":0,"t":"social-studies","tl":45},{"p":"Which of the following scenarios best describes an application of social security benefits?","o":["A teacher receives a scholarship to study abroad","A family member receives financial support after the death of the bread winner","A community receives funds for a new irrigation project","An entrepreneur receives a loan to expand the business"],"c":1,"t":"social-studies","tl":45},{"p":"What type of climate, typically found near the equator, is characterized by very high temperatures and very low rainfall?","o":["Desert climate","Temperate climate","Polar climate","Tropical climate"],"c":0,"t":"social-studies","tl":45},{"p":"Controlling plastic waste has become a major environmental concern to the city authorities in Ghana. Which of the following options best helps minimize the negative impact of plastic waste disposal problem?","o":["Arresting all plastic waste producers","Placing a ban on single use plastics","Levying plastic waste producers","Using jute and paper bags"],"c":1,"t":"social-studies","tl":45},{"p":"Which of the following agricultural practices helps to prevent soil erosion?","o":["Cover cropping","Mono-culture","Crop rotation","Shifting cultivation"],"c":0,"t":"social-studies","tl":45},{"p":"A teacher, Mr Jones, encourages his students to work together on a group project. What agency of socialization is influencing the students' behaviour?","o":["Education","Media","Family","Peer group"],"c":3,"t":"social-studies","tl":45}]}}}},"topicLabels":{"careertechnology":"Careertechnology","career-technology":"Career Technology","computing":"Computing","creativeartsanddesign":"Creativeartsanddesign","creative-arts-and-design":"Creative Arts and Design","english":"English","english-language":"English Language","mathematics":"Mathematics","rme":"Rme","religious-and-moral-education":"Religious and Moral Education","science":"Science","integrated-science":"Integrated Science","socialstudies":"Socialstudies","social-studies":"Social Studies"}};
</script>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var HISTORY_KEY = "revisionBookHistoryV1";

  // ---------- utilities ----------

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function histKey(subjectKey, year) { return subjectKey + "|" + year; }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      if (!raw) return {};
      return JSON.parse(raw) || {};
    } catch (e) {
      return {};
    }
  }

  function saveHistory(h) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
    } catch (e) {
      /* storage unavailable — session still works, just won't persist */
    }
  }

  function recordAttempt(subjectKey, year, mode, score, total) {
    var h = loadHistory();
    var k = histKey(subjectKey, year);
    if (!h[k]) h[k] = { attempts: [], best: {} };
    var entry = { date: new Date().toISOString(), mode: mode, score: score, total: total };
    h[k].attempts.unshift(entry);
    h[k].attempts = h[k].attempts.slice(0, 20);
    var prevBest = h[k].best[mode];
    var isNewBest = !prevBest || score > prevBest.score;
    if (isNewBest) h[k].best[mode] = { score: score, total: total, date: entry.date };
    saveHistory(h);
    return isNewBest;
  }

  function yearHistory(subjectKey, year) {
    var h = loadHistory();
    return h[histKey(subjectKey, year)] || { attempts: [], best: {} };
  }

  function bestAcrossYears(subjectKey, years) {
    var h = loadHistory();
    var best = null;
    years.forEach(function (year) {
      var rec = h[histKey(subjectKey, year)];
      if (!rec) return;
      ["timed", "untimed"].forEach(function (mode) {
        var b = rec.best[mode];
        if (b) {
          var pct = b.score / b.total;
          if (!best || pct > best.pct) best = { pct: pct, score: b.score, total: b.total, mode: mode, year: year };
        }
      });
    });
    return best;
  }

  var INSTALL_TIP_KEY = "revisionBookInstallTipDismissed";

  function isStandalone() {
    try {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    } catch (e) { return false; }
  }

  function isIOS() {
    return /iPhone|iPad|iPod/.test(navigator.userAgent);
  }

  function installTipDismissed() {
    try { return localStorage.getItem(INSTALL_TIP_KEY) === "1"; } catch (e) { return false; }
  }

  function dismissInstallTip() {
    try { localStorage.setItem(INSTALL_TIP_KEY, "1"); } catch (e) {}
  }

  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    } catch (e) { return ""; }
  }

  // ---------- state ----------

  var state = {
    view: "home",
    subjectKey: null,
    year: null,
    mode: null,
    quizQueue: [],
    quizIndex: 0,
    answers: [],
    justFinishedBest: false
  };

  function subjectYears(key) {
    return Object.keys(DATA.subjects[key].years).sort(function (a, b) { return b - a; });
  }

  function subjectQuestions(key, year) {
    return DATA.subjects[key].years[year].questions;
  }

  function prepQuestion(q) {
    var order = shuffle([0, 1, 2, 3]);
    var options = order.map(function (i) { return q.o[i]; });
    var correctIndex = order.indexOf(q.c);
    return { p: q.p, o: options, c: correctIndex, t: q.t, tl: q.tl };
  }

  function startQuiz(subjectKey, year, mode, questionSubset) {
    var pool = questionSubset || subjectQuestions(subjectKey, year);
    state.subjectKey = subjectKey;
    state.year = year;
    state.mode = mode;
    state.quizQueue = shuffle(pool).map(prepQuestion);
    state.quizIndex = 0;
    state.answers = [];
    state.view = "quiz";
    render();
  }

  // ---------- rendering: home ----------

  function renderHome() {
    var keys = Object.keys(DATA.subjects);
    var rows = keys.map(function (key) {
      var s = DATA.subjects[key];
      var years = subjectYears(key);
      var totalQ = years.reduce(function (sum, y) { return sum + s.years[y].questions.length; }, 0);
      var best = bestAcrossYears(key, years);
      var bestBit = best ? (best.year + " " + (best.mode === "timed" ? "timed" : "untimed") + " best " + best.score + "/" + best.total) : "";
      return (
        '<button class="subject-card" data-key="' + key + '">' +
          '<span class="subject-code">' + s.code + "</span>" +
          '<span class="subject-meta">' +
            '<span class="subject-name">' + escapeHtml(s.title) + "</span>" +
            '<span class="subject-sub"><span>' + years.join(" & ") + "</span><span>·</span><span>" + totalQ + " questions</span></span>" +
          "</span>" +
          (bestBit ? '<span class="subject-best">' + escapeHtml(bestBit) + "</span>" : "") +
        "</button>"
      );
    }).join("");

    var showTip = !isStandalone() && !installTipDismissed();
    var tipText = isIOS()
      ? "Add to your home screen: tap the Share icon, then \u201cAdd to Home Screen.\u201d"
      : "Add to your home screen: open the browser menu and tap \u201cAdd to Home screen\u201d or \u201cInstall app.\u201d";
    var tipHtml = showTip
      ? '<div class="install-tip" id="install-tip">' +
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          '<span class="tip-text">' + tipText + "</span>" +
          '<button class="tip-dismiss" id="tip-dismiss" aria-label="Dismiss">\u00d7</button>' +
        "</div>"
      : "";

    app.innerHTML =
      '<div class="screen">' +
        '<div class="masthead"><h1>Revision Book</h1><span class="tag">BECE</span></div>' +
        tipHtml +
        '<p class="intro">Past-question practice, one subject at a time. Pick a subject to start.</p>' +
        '<div class="subject-list">' + rows + "</div>" +
      "</div>";

    if (showTip) {
      app.querySelector("#tip-dismiss").addEventListener("click", function (e) {
        e.stopPropagation();
        dismissInstallTip();
        document.getElementById("install-tip").remove();
      });
    }

    Array.prototype.forEach.call(app.querySelectorAll(".subject-card"), function (btn) {
      btn.addEventListener("click", function () {
        state.subjectKey = btn.getAttribute("data-key");
        state.view = "subject";
        render();
      });
    });
  }

  // ---------- rendering: subject (year picker) ----------

  function renderSubject() {
    var key = state.subjectKey;
    var s = DATA.subjects[key];
    var years = subjectYears(key);

    var rows = years.map(function (year) {
      var count = s.years[year].questions.length;
      var hist = yearHistory(key, year);
      var bestBits = [];
      if (hist.best.timed) bestBits.push("Timed " + hist.best.timed.score + "/" + hist.best.timed.total);
      if (hist.best.untimed) bestBits.push("Untimed " + hist.best.untimed.score + "/" + hist.best.untimed.total);
      return (
        '<button class="subject-card" data-year="' + year + '">' +
          '<span class="subject-code">' + year + "</span>" +
          '<span class="subject-meta">' +
            '<span class="subject-name">' + year + " paper</span>" +
            '<span class="subject-sub"><span>' + count + " questions</span></span>" +
          "</span>" +
          (bestBits.length ? '<span class="subject-best">' + escapeHtml(bestBits.join(" · ")) + "</span>" : "") +
        "</button>"
      );
    }).join("");

    app.innerHTML =
      '<div class="screen">' +
        '<div class="back-row"><button class="back-btn" id="back-home">' + backIcon() + "Subjects</button></div>" +
        '<div class="masthead"><h1>' + escapeHtml(s.title) + "</h1></div>" +
        '<p class="intro">Choose a paper to practice.</p>' +
        '<div class="subject-list">' + rows + "</div>" +
      "</div>";

    app.querySelector("#back-home").addEventListener("click", function () { state.view = "home"; render(); });
    Array.prototype.forEach.call(app.querySelectorAll(".subject-card"), function (btn) {
      btn.addEventListener("click", function () {
        state.year = btn.getAttribute("data-year");
        state.view = "year";
        render();
      });
    });
  }

  // ---------- rendering: year detail (stats + start) ----------

  function renderYear() {
    var key = state.subjectKey;
    var year = state.year;
    var s = DATA.subjects[key];
    var q = s.years[year].questions;
    var hist = yearHistory(key, year);

    var timedBest = hist.best.timed ? hist.best.timed.score + "/" + hist.best.timed.total : "—";
    var untimedBest = hist.best.untimed ? hist.best.untimed.score + "/" + hist.best.untimed.total : "—";
    var attemptCount = hist.attempts.length;

    var historyRows = hist.attempts.slice(0, 5).map(function (a) {
      return (
        '<div class="history-row">' +
          '<span>' + fmtDate(a.date) + ' <span class="h-mode">· ' + (a.mode === "timed" ? "Timed" : "Untimed") + "</span></span>" +
          '<span class="h-score">' + a.score + "/" + a.total + "</span>" +
        "</div>"
      );
    }).join("");

    var timeNote = s.isCalc
      ? "Full working time per question, since this subject involves calculation."
      : "45 seconds per question in timed mode.";

    app.innerHTML =
      '<div class="screen">' +
        '<div class="back-row"><button class="back-btn" id="back-subject">' + backIcon() + escapeHtml(s.title) + "</button></div>" +
        '<div class="paper-header">' +
          '<span class="code-badge">' + s.code + "</span>" +
          "<h2>" + escapeHtml(s.title) + "</h2>" +
          '<p class="meta-line">' + q.length + " questions · " + year + " paper</p>" +
        "</div>" +
        '<div class="stat-row">' +
          '<div class="stat-box"><span class="num">' + timedBest + '</span><span class="lbl">Timed best</span></div>' +
          '<div class="stat-box"><span class="num">' + untimedBest + '</span><span class="lbl">Untimed best</span></div>' +
          '<div class="stat-box"><span class="num">' + attemptCount + '</span><span class="lbl">Attempts</span></div>' +
        "</div>" +
        '<button class="start-btn" id="start-timed">' +
          '<span>Start timed test<span class="desc">' + timeNote + "</span></span>" +
          chevIcon() +
        "</button>" +
        '<button class="start-btn secondary" id="start-untimed">' +
          '<span>Start untimed practice<span class="desc">No clock — work at your own pace.</span></span>' +
          chevIcon() +
        "</button>" +
        (attemptCount ? '<div class="history-block"><h3>Recent attempts</h3>' + historyRows + "</div>" : "") +
      "</div>";

    app.querySelector("#back-subject").addEventListener("click", function () { state.view = "subject"; render(); });
    app.querySelector("#start-timed").addEventListener("click", function () { startQuiz(key, year, "timed"); });
    app.querySelector("#start-untimed").addEventListener("click", function () { startQuiz(key, year, "untimed"); });
  }

  // ---------- rendering: quiz ----------

  var timerHandle = null;
  var timerState = { remaining: 0, total: 0 };

  function clearTimer() {
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
  }

  function renderQuiz() {
    clearTimer();
    var s = DATA.subjects[state.subjectKey];
    var q = state.quizQueue[state.quizIndex];
    var total = state.quizQueue.length;
    var idx = state.quizIndex;
    var pctDone = Math.round((idx / total) * 100);

    var timerHtml = state.mode === "timed"
      ? '<div class="timer-ring" id="timer-ring">' +
          '<svg viewBox="0 0 46 46"><circle class="track" cx="23" cy="23" r="19"></circle>' +
          '<circle class="progress" id="timer-circle" cx="23" cy="23" r="19"></circle></svg>' +
          '<span class="num" id="timer-num"></span>' +
        "</div>"
      : "";

    app.innerHTML =
      '<div class="quiz-top">' +
        '<div class="quiz-progress"><span class="subject-tag">' + escapeHtml(s.title) + " " + state.year + '</span>Question ' + (idx + 1) + " of " + total + "</div>" +
        timerHtml +
      "</div>" +
      '<div class="quiz-bar"><div class="quiz-bar-fill" style="width:' + pctDone + '%"></div></div>' +
      '<div class="quiz-body">' +
        '<p class="question-prompt">' + escapeHtml(q.p) + "</p>" +
        '<div class="option-list" id="option-list"></div>' +
        '<div id="timeout-slot"></div>' +
      "</div>" +
      '<div class="quiz-footer" id="quiz-footer" style="display:none">' +
        '<button class="next-btn" id="next-btn"></button>' +
      "</div>";

    var letters = ["A", "B", "C", "D"];
    var list = app.querySelector("#option-list");
    q.o.forEach(function (optText, i) {
      var row = document.createElement("button");
      row.className = "option-row";
      row.setAttribute("data-i", i);
      row.innerHTML = '<span class="mark">' + letters[i] + '</span><span class="opt-text">' + escapeHtml(optText) + "</span>";
      row.addEventListener("click", function () { onAnswer(i); });
      list.appendChild(row);
    });

    if (state.mode === "timed") {
      startTimer(q.tl);
    }
  }

  function startTimer(seconds) {
    timerState.total = seconds;
    timerState.remaining = seconds;
    var circle = document.getElementById("timer-circle");
    var num = document.getElementById("timer-num");
    var r = 19, circumference = 2 * Math.PI * r;
    circle.style.strokeDasharray = circumference.toFixed(1);

    function paint() {
      var frac = Math.max(timerState.remaining, 0) / timerState.total;
      circle.style.strokeDashoffset = (circumference * (1 - frac)).toFixed(1);
      circle.classList.toggle("urgent", timerState.remaining <= 10);
      num.textContent = Math.max(Math.ceil(timerState.remaining), 0);
    }
    paint();

    timerHandle = setInterval(function () {
      timerState.remaining -= 0.25;
      paint();
      if (timerState.remaining <= 0) {
        clearTimer();
        onTimeout();
      }
    }, 250);
  }

  function onTimeout() {
    var q = state.quizQueue[state.quizIndex];
    revealAnswer(null, q);
    var slot = document.getElementById("timeout-slot");
    if (slot) slot.innerHTML = '<p class="timeout-note">Time\u2019s up — marked as unanswered.</p>';
  }

  function onAnswer(selectedIndex) {
    clearTimer();
    var q = state.quizQueue[state.quizIndex];
    revealAnswer(selectedIndex, q);
  }

  function revealAnswer(selectedIndex, q) {
    var rows = app.querySelectorAll(".option-row");
    Array.prototype.forEach.call(rows, function (row) {
      var i = parseInt(row.getAttribute("data-i"), 10);
      row.disabled = true;
      if (i === q.c) row.classList.add("correct");
      else if (i === selectedIndex) row.classList.add("incorrect");
      else row.classList.add("dim");
    });

    var correct = selectedIndex === q.c;
    state.answers.push({ question: q, selected: selectedIndex, correct: correct });

    var footer = document.getElementById("quiz-footer");
    var nextBtn = document.getElementById("next-btn");
    var isLast = state.quizIndex === state.quizQueue.length - 1;
    nextBtn.textContent = isLast ? "See results" : "Next question";
    footer.style.display = "flex";
    nextBtn.onclick = function () {
      if (isLast) {
        finishQuiz();
      } else {
        state.quizIndex += 1;
        renderQuiz();
      }
    };
  }

  function finishQuiz() {
    var score = state.answers.filter(function (a) { return a.correct; }).length;
    var total = state.answers.length;
    state.justFinishedBest = recordAttempt(state.subjectKey, state.year, state.mode, score, total);
    state.view = "review";
    render();
  }

  // ---------- rendering: review ----------

  function renderReview() {
    var s = DATA.subjects[state.subjectKey];
    var score = state.answers.filter(function (a) { return a.correct; }).length;
    var total = state.answers.length;
    var pct = total ? Math.round((score / total) * 100) : 0;
    var missed = state.answers.filter(function (a) { return !a.correct; });

    var topicMiss = {};
    var topicTotal = {};
    state.answers.forEach(function (a) {
      var t = a.question.t;
      topicTotal[t] = (topicTotal[t] || 0) + 1;
      if (!a.correct) topicMiss[t] = (topicMiss[t] || 0) + 1;
    });
    var weakTopics = Object.keys(topicMiss).sort(function (x, y) { return topicMiss[y] - topicMiss[x]; });

    var weakHtml = weakTopics.length
      ? '<div class="weak-block"><h3>Struggled with</h3>' +
          weakTopics.map(function (t) {
            var label = DATA.topicLabels[t] || t;
            return '<div class="weak-row"><span>' + escapeHtml(label) + '</span><span class="weak-count">' + topicMiss[t] + " of " + topicTotal[t] + " missed</span></div>";
          }).join("") +
        "</div>"
      : '<div class="weak-block"><h3>Struggled with</h3><p class="empty-note">No weak spots this round — every topic answered correctly.</p></div>';

    var letters = ["A", "B", "C", "D"];
    var missedHtml = missed.length
      ? '<div class="missed-block"><h3>Questions to review</h3>' +
          missed.map(function (a) {
            var q = a.question;
            var yourAnswer = a.selected === null ? "No answer" : letters[a.selected] + ". " + q.o[a.selected];
            return (
              '<div class="missed-item">' +
                '<div class="m-topic">' + escapeHtml(DATA.topicLabels[q.t] || q.t) + "</div>" +
                '<p class="m-prompt">' + escapeHtml(q.p) + "</p>" +
                '<div class="m-answer wrong"><span class="lbl">Your answer</span><span class="val">' + escapeHtml(yourAnswer) + "</span></div>" +
                '<div class="m-answer right"><span class="lbl">Correct answer</span><span class="val">' + letters[q.c] + ". " + escapeHtml(q.o[q.c]) + "</span></div>" +
              "</div>"
            );
          }).join("") +
        "</div>"
      : "";

    app.innerHTML =
      '<div class="screen">' +
        '<div class="masthead"><h1>Results</h1><span class="tag">' + (state.mode === "timed" ? "Timed" : "Untimed") + "</span></div>" +
        '<div class="score-card">' +
          '<p class="score-num">' + score + " / " + total + "</p>" +
          '<p class="score-pct">' + pct + "% correct · " + escapeHtml(s.title) + " " + state.year + "</p>" +
          (state.justFinishedBest ? '<p class="best-note">New personal best</p>' : "") +
        "</div>" +
        weakHtml +
        missedHtml +
        '<div class="action-row">' +
          (missed.length ? '<button class="start-btn" id="retry-missed">Retry incorrect questions' + chevIcon() + "</button>" : "") +
          '<button class="start-btn secondary" id="back-year">Back to ' + escapeHtml(s.title) + " " + state.year + chevIcon() + "</button>" +
        "</div>" +
      "</div>";

    if (missed.length) {
      app.querySelector("#retry-missed").addEventListener("click", function () {
        var retryPool = missed.map(function (a) {
          var q = a.question;
          return { p: q.p, o: q.o.slice(), c: q.c, t: q.t, tl: q.tl };
        });
        startQuiz(state.subjectKey, state.year, state.mode, retryPool);
      });
    }
    app.querySelector("#back-year").addEventListener("click", function () { state.view = "year"; render(); });
  }

  // ---------- icons ----------

  function backIcon() {
    return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 3L5 8l5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }
  function chevIcon() {
    return '<svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3l5 5-5 5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  // ---------- router ----------

  function render() {
    window.scrollTo(0, 0);
    if (state.view === "home") renderHome();
    else if (state.view === "subject") renderSubject();
    else if (state.view === "year") renderYear();
    else if (state.view === "quiz") renderQuiz();
    else if (state.view === "review") renderReview();
  }

  render();
})();

</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* offline caching just won't be available */ });
    });
  }
</script>
</body>
